<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>どうぶつクイズ</title>
<style>
  :root {
    --pink: #ff8fab;
    --yellow: #ffd23f;
    --blue: #4ecdc4;
    --green: #6bcf63;
    --purple: #a06cd5;
    --bg: #fff6e9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, var(--bg), #ffe3ec);
    overflow-x: hidden;
  }
  #app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .screen { width: 100%; display: none; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }

  /* ---- Title screen ---- */
  #title h1 {
    font-size: clamp(2rem, 8vw, 3rem);
    color: #ff6b8b;
    text-shadow: 3px 3px 0 #fff, 5px 5px 0 rgba(0,0,0,0.08);
    text-align: center;
    margin: 40px 0 8px;
  }
  .title-emojis { font-size: clamp(2.5rem, 10vw, 3.5rem); margin-bottom: 20px; letter-spacing: 8px; }
  #startBtn {
    font-size: 1.6rem;
    padding: 18px 48px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(180deg, #ffb84d, #ff8f3d);
    color: #fff;
    font-weight: bold;
    box-shadow: 0 6px 0 #d96e1f, 0 10px 20px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: transform 0.1s;
  }
  #startBtn:active { transform: translateY(6px); box-shadow: 0 0 0 #d96e1f; }
  .sub { color: #a05a3f; font-size: 1.1rem; margin-top: 10px; text-align: center; }

  /* ---- Loading screen ---- */
  #loading .spinner {
    width: 64px;
    height: 64px;
    border: 8px solid #ffe0ea;
    border-top-color: #ff8f3d;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin: 60px 0 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 1.2rem; color: #a05a3f; font-weight: bold; }

  /* ---- Quiz screen ---- */
  .top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    margin-bottom: 4px;
  }
  .progress-wrap {
    flex: 1;
    height: 22px;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
    margin-right: 12px;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--green), var(--blue));
    border-radius: 20px;
    transition: width 0.4s ease;
  }
  .score-badge {
    background: #fff;
    border-radius: 20px;
    padding: 6px 14px;
    font-weight: bold;
    color: #ff6b8b;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    white-space: nowrap;
    font-size: 1.1rem;
  }
  .question-card {
    background: #fff;
    border-radius: 24px;
    width: 100%;
    padding: 24px 16px 32px;
    margin-top: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
    position: relative;
  }
  .q-num { color: #bbb; font-weight: bold; font-size: 0.95rem; }
  .q-text {
    font-size: clamp(1.5rem, 6vw, 2.1rem);
    font-weight: bold;
    color: #444;
    margin: 8px 0 24px;
  }
  .q-text .highlight { color: #ff6b8b; }
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .choice-btn {
    border: 4px solid #ffe0ea;
    background: #fffaf5;
    border-radius: 20px;
    padding: 14px 8px;
    cursor: pointer;
    transition: transform 0.12s, background 0.2s, border-color 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .choice-btn:active { transform: scale(0.96); }
  .choice-media {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    background: #f3f3f3;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .choice-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .choice-emoji { font-size: clamp(3rem, 14vw, 4.5rem); }
  .choice-name { font-size: 1.1rem; font-weight: bold; color: #666; }
  .choice-btn.correct { background: #e3fbe0; border-color: var(--green); animation: pop 0.3s; }
  .choice-btn.wrong { background: #ffe3e3; border-color: #ff6b6b; animation: shake 0.35s; }
  .choice-btn.disabled { pointer-events: none; opacity: 0.55; }
  .choice-btn.disabled.correct, .choice-btn.disabled.wrong { opacity: 1; }

  @keyframes pop { 0% { transform: scale(1);} 50% { transform: scale(1.08);} 100% { transform: scale(1);} }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .feedback {
    margin-top: 18px;
    font-size: 1.4rem;
    font-weight: bold;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .feedback.correct { color: #3fae3f; }
  .feedback.wrong { color: #ff5c5c; }

  /* ---- Result screen ---- */
  #result h2 {
    font-size: clamp(1.8rem, 7vw, 2.4rem);
    color: #ff6b8b;
    margin-top: 30px;
  }
  .result-emoji { font-size: 5rem; margin: 10px 0; }
  .result-score {
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: bold;
    color: #444;
    margin-bottom: 6px;
  }
  .stars { font-size: 2.2rem; letter-spacing: 6px; margin-bottom: 20px; }
  .result-msg { font-size: 1.2rem; color: #a05a3f; margin-bottom: 26px; text-align: center; }
  #retryBtn {
    font-size: 1.4rem;
    padding: 16px 44px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(180deg, #6bd6cf, #33b6ac);
    color: #fff;
    font-weight: bold;
    box-shadow: 0 6px 0 #248f87, 0 10px 20px rgba(0,0,0,0.15);
    cursor: pointer;
    margin-bottom: 60px;
  }
  #retryBtn:active { transform: translateY(6px); box-shadow: 0 0 0 #248f87; }

  .confetti {
    position: fixed;
    top: -20px;
    font-size: 1.6rem;
    animation: fall linear forwards;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- タイトル画面 -->
  <div id="title" class="screen active">
    <h1>どうぶつクイズ</h1>
    <div class="title-emojis">🦁🐼🐘🦒🐧</div>
    <button id="startBtn">スタート！</button>
    <p class="sub">ぜんぶで <span id="totalQTitle">10</span>もん<br>どうぶつを あてよう！</p>
  </div>

  <!-- よみこみ画面 -->
  <div id="loading" class="screen">
    <div class="spinner"></div>
    <p>しゃしんを よみこみちゅう...</p>
  </div>

  <!-- クイズ画面 -->
  <div id="quiz" class="screen">
    <div class="top-bar">
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="score-badge">⭐ <span id="scoreText">0</span></div>
    </div>
    <div class="question-card">
      <div class="q-num"><span id="qIndex">1</span> / <span id="totalQ">10</span> もんめ</div>
      <div class="q-text"><span class="highlight" id="qAnimalName"></span>は どっち？</div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="result" class="screen">
    <h2>クリア！</h2>
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-score"><span id="finalScore">0</span> / <span id="totalQResult">10</span> もん せいかい</div>
    <div class="stars" id="stars"></div>
    <div class="result-msg" id="resultMsg"></div>
    <button id="retryBtn">もういちど あそぶ</button>
  </div>

</div>

    { name: "オランウータン", query: "オランウータン", emoji: "🦧", cat: "mammal" },
    { name: "カンガルー", query: "カンガルー", emoji: "🦘", cat: "mammal" },
    { name: "ウシ", query: "ウシ", emoji: "🐮", cat: "mammal" },
    { name: "ブタ", query: "ブタ", emoji: "🐷", cat: "mammal" },

    { name: "アザラシ", query: "アザラシ", emoji: "🦭", cat: "mammal" },
    { name: "セイウチ", query: "セイウチ", emoji: "🦭", cat: "mammal" },
    { name: "ラッコ", query: "ラッコ", emoji: "🦦", cat: "mammal" },
    { name: "イルカ", query: "マイルカ", emoji: "🐬", cat: "mammal" },
    { name: "クジラ", query: "クジラ", emoji: "🐳", cat: "mammal" },
    // 鳥類
    { name: "ペンギン", query: "ペンギン", emoji: "🐧", cat: "bird" },
    { name: "フクロウ", query: "フクロウ", emoji: "🦉", cat: "bird" },
    { name: "ワシ", query: "イヌワシ", emoji: "🦅", cat: "bird" },
    { name: "タカ", query: "タカ", emoji: "🦅", cat: "bird" },
    { name: "クジャク", query: "クジャク", emoji: "🦚", cat: "bird" },
    { name: "フラミンゴ", query: "フラミンゴ", emoji: "🦩", cat: "bird" },
    { name: "ハクチョウ", query: "ハクチョウ", emoji: "🦢", cat: "bird" },
    { name: "ツル", query: "タンチョウ", emoji: "🕊️", cat: "bird" },
    { name: "ニワトリ", query: "ニワトリ", emoji: "🐔", cat: "bird" },
    { name: "アヒル", query: "アヒル", emoji: "🦆", cat: "bird" },
    { name: "カラス", query: "カラス", emoji: "🐦‍⬛", cat: "bird" },
    { name: "スズメ", query: "スズメ", emoji: "🐦", cat: "bird" },
    { name: "ハト", query: "ハト", emoji: "🕊️", cat: "bird" },

    { name: "ダチョウ", query: "ダチョウ", emoji: "🦤", cat: "bird" },
    // 魚・海の生き物
    { name: "サメ", query: "サメ", emoji: "🦈", cat: "sea" },
    { name: "タコ", query: "タコ", emoji: "🐙", cat: "sea" },
    { name: "イカ", query: "イカ", emoji: "🦑", cat: "sea" },
    { name: "カニ", query: "カニ", emoji: "🦀", cat: "sea" },
    { name: "エビ", query: "エビ", emoji: "🦐", cat: "sea" },
    { name: "クラゲ", query: "クラゲ", emoji: "🪼", cat: "sea" },
    { name: "マグロ", query: "マグロ", emoji: "🐟", cat: "sea" },
    { name: "フグ", query: "フグ", emoji: "🐡", cat: "sea" },
    { name: "クマノミ", query: "クマノミ", emoji: "🐠", cat: "sea" },
    { name: "タツノオトシゴ", query: "タツノオトシゴ", emoji: "🐴", cat: "sea" },
    { name: "ウナギ", query: "ウナギ", emoji: "🐍", cat: "sea" },
    { name: "カメ", query: "ウミガメ", emoji: "🐢", cat: "reptile" },
    // は虫類
    { name: "ワニ", query: "ワニ", emoji: "🐊", cat: "reptile" },
    { name: "ヘビ", query: "ヘビ", emoji: "🐍", cat: "reptile" },
    { name: "トカゲ", query: "トカゲ", emoji: "🦎", cat: "reptile" },
    { name: "イグアナ", query: "イグアナ", emoji: "🦎", cat: "reptile" },
    { name: "カメレオン", query: "カメレオン", emoji: "🦎", cat: "reptile" },
    // 両生類
    { name: "カエル", query: "カエル", emoji: "🐸", cat: "amphibian" },
    { name: "イモリ", query: "イモリ", emoji: "🦎", cat: "amphibian" },
    { name: "サンショウウオ", query: "サンショウウオ", emoji: "🦎", cat: "amphibian" },
    // 昆虫など
    { name: "チョウ", query: "チョウ", emoji: "🦋", cat: "insect" },
    { name: "ミツバチ", query: "セイヨウミツバチ", emoji: "🐝", cat: "insect" },
    { name: "テントウムシ", query: "テントウムシ", emoji: "🐞", cat: "insect" },
    { name: "アリ", query: "アリ", emoji: "🐜", cat: "insect" },
    { name: "トンボ", query: "トンボ", emoji: "🐉", cat: "insect" },
    { name: "セミ", query: "セミ", emoji: "🦗", cat: "insect" },
    { name: "カブトムシ", query: "カブトムシ", emoji: "🪲", cat: "insect" },
    { name: "クワガタ", query: "クワガタムシ", emoji: "🪲", cat: "insect" },
    { name: "バッタ", query: "バッタ", emoji: "🦗", cat: "insect" },
    { name: "カタツムリ", query: "カタツムリ", emoji: "🐌", cat: "insect" }
  ];

  const TOTAL_QUESTIONS = 15;
  const imageCache = {};

  const titleScreen = document.getElementById("title");
  const loadingScreen = document.getElementById("loading");
  const quizScreen = document.getElementById("quiz");
  const resultScreen = document.getElementById("result");
  const startBtn = document.getElementById("startBtn");
  const retryBtn = document.getElementById("retryBtn");
  const progressBar = document.getElementById("progressBar");
  const scoreText = document.getElementById("scoreText");
  const qIndexEl = document.getElementById("qIndex");
  const qAnimalName = document.getElementById("qAnimalName");
  const choicesEl = document.getElementById("choices");
  const feedbackEl = document.getElementById("feedback");
  const finalScoreEl = document.getElementById("finalScore");
  const starsEl = document.getElementById("stars");
  const resultMsgEl = document.getElementById("resultMsg");
  const resultEmojiEl = document.getElementById("resultEmoji");

  [document.getElementById("totalQTitle"), document.getElementById("totalQ"), document.getElementById("totalQResult")]
    .forEach((el) => { if (el) el.textContent = TOTAL_QUESTIONS; });

  let questions = [];
  let currentIndex = 0;
  let score = 0;
  let locked = false;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQuestions() {
    const pool = shuffle(ANIMALS).slice(0, TOTAL_QUESTIONS);
    return pool.map((correct) => {
      // 同じなかま（カテゴリ）から間違い選択肢を選ぶ→見分けにくくてむずかしい
      const sameCategory = ANIMALS.filter((a) => a.cat === correct.cat && a.name !== correct.name);
      const others = ANIMALS.filter((a) => a.name !== correct.name);
      const candidates = sameCategory.length > 0 ? sameCategory : others;
      const wrong = shuffle(candidates)[0];
      const options = shuffle([correct, wrong]);
      return { correct, options };
    });
  }

  // Wikipedia(ja)から実写真のサムネイルURLを取得。取得できない場合はnull。
  async function fetchImageUrl(query) {
    if (imageCache[query] !== undefined) return imageCache[query];
    try {
      const url = "https://ja.wikipedia.org/w/api.php?origin=*&action=query&format=json"
        + "&prop=pageimages&piprop=thumbnail&pithumbsize=500&redirects=1"
        + "&titles=" + encodeURIComponent(query);
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timeoutId);
      if (!res.ok) throw new Error("network");
      const data = await res.json();
      const pages = data.query && data.query.pages;
      let thumb = null;
      if (pages) {
        const page = Object.values(pages)[0];
        if (page && page.thumbnail && page.thumbnail.source) {
          thumb = page.thumbnail.source;
        }
      }
      imageCache[query] = thumb;
      return thumb;
    } catch (e) {
      imageCache[query] = null;
      return null;
    }
  }

  function showScreen(el) {
    [titleScreen, loadingScreen, quizScreen, resultScreen].forEach((s) => s.classList.remove("active"));
    el.classList.add("active");
  }

  async function startGame() {
    showScreen(loadingScreen);
    questions = buildQuestions();
    currentIndex = 0;
    score = 0;
    scoreText.textContent = "0";

    // 必要な動物の画像を先読み（並列取得、失敗しても続行）
    const neededQueries = new Set();
    questions.forEach((q) => q.options.forEach((o) => neededQueries.add(o.query)));
    await Promise.all(Array.from(neededQueries).map((q) => fetchImageUrl(q)));

    showScreen(quizScreen);
    renderQuestion();
  }

  function renderQuestion() {
    locked = false;
    feedbackEl.textContent = "";
    feedbackEl.className = "feedback";
    const q = questions[currentIndex];
    qIndexEl.textContent = currentIndex + 1;
    qAnimalName.textContent = q.correct.name;
    progressBar.style.width = ((currentIndex) / TOTAL_QUESTIONS * 100) + "%";

    choicesEl.innerHTML = "";
    q.options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";

      const mediaWrap = document.createElement("div");
      mediaWrap.className = "choice-media";
      const cachedUrl = imageCache[opt.query];
      if (cachedUrl) {
        const img = document.createElement("img");
        img.src = cachedUrl;
        img.alt = opt.name;
        img.onerror = () => {
          mediaWrap.innerHTML = `<span class="choice-emoji">${opt.emoji}</span>`;
        };
        mediaWrap.appendChild(img);
      } else {
        mediaWrap.innerHTML = `<span class="choice-emoji">${opt.emoji}</span>`;
      }

      const nameEl = document.createElement("span");
      nameEl.className = "choice-name";
      nameEl.textContent = opt.name;

      btn.appendChild(mediaWrap);
      btn.appendChild(nameEl);
      btn.addEventListener("click", () => onChoose(btn, opt, q.correct));
      choicesEl.appendChild(btn);
    });
  }

  function onChoose(btn, chosen, correct) {
    if (locked) return;
    locked = true;
    const isCorrect = chosen.name === correct.name;
    const allButtons = choicesEl.querySelectorAll(".choice-btn");
    allButtons.forEach((b) => b.classList.add("disabled"));

    if (isCorrect) {
      btn.classList.add("correct");
      score++;
      scoreText.textContent = score;
      feedbackEl.textContent = "🎉 せいかい！";
      feedbackEl.classList.add("correct");
    } else {
      btn.classList.add("wrong");
      allButtons.forEach((b) => {
        if (b.querySelector(".choice-name").textContent === correct.name) {
          b.classList.add("correct");
        }
      });
      feedbackEl.textContent = `😅 ざんねん！ ${correct.name}だよ`;
      feedbackEl.classList.add("wrong");
    }

    progressBar.style.width = ((currentIndex + 1) / TOTAL_QUESTIONS * 100) + "%";

    setTimeout(() => {
      currentIndex++;
      if (currentIndex >= TOTAL_QUESTIONS) {
        showResult();
      } else {
        renderQuestion();
      }
    }, 1200);
  }

  function showResult() {
    showScreen(resultScreen);
    finalScoreEl.textContent = score;
    const ratio = score / TOTAL_QUESTIONS;
    const starCount = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : ratio >= 0.3 ? 1 : 0;
    starsEl.textContent = "⭐".repeat(starCount) + "☆".repeat(3 - starCount);

    if (score === TOTAL_QUESTIONS) {
      resultEmojiEl.textContent = "🏆";
      resultMsgEl.textContent = "パーフェクト！ すごい どうぶつ はかせだね！";
      launchConfetti();
    } else if (ratio >= 0.7) {
      resultEmojiEl.textContent = "🎉";
      resultMsgEl.textContent = "よくできました！ もう少しで はかせだよ！";
    } else if (ratio >= 0.4) {
      resultEmojiEl.textContent = "😊";
      resultMsgEl.textContent = "がんばったね！ もう一回 ちょうせんしよう！";
    } else {
      resultEmojiEl.textContent = "🐣";
      resultMsgEl.textContent = "どんどん おぼえていこう！";
    }
  }

  function launchConfetti() {
    const emojis = ["🎉", "⭐", "🎊", "🌟", "✨"];
    for (let i = 0; i < 24; i++) {
      const el = document.createElement("div");
      el.className = "confetti";
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = 2 + Math.random() * 1.5 + "s";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  }

  startBtn.addEventListener("click", startGame);
  retryBtn.addEventListener("click", startGame);
})();
</script>
</body>
</html>
